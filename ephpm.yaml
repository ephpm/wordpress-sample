version: 1
php: "8.5"
docroot: "."
build:
  # Assemble the deployable docroot IN PLACE (docroot is "."): fetch WordPress
  # core and lay down the drop-ins the checkout does not already carry.
  # assemble.sh is same-path aware, so the files that came with the checkout are
  # left untouched rather than a `cp a a` aborting the build (which left an
  # empty/broken docroot on redeploy).
  - "./assemble.sh ."
  # There is no composer.json here (the drop-ins are vendored as real files —
  # they have to be, see the open_basedir note in the README), so the
  # unconditional `composer install` this used to run failed on every single
  # deploy. Guarded so it is a no-op until a composer.json genuinely appears.
  - "if [ -f composer.json ]; then composer install --no-dev --optimize-autoloader --no-interaction; fi"
  # TEMPORARY sandbox-containment probe (switchboard#29 confirmation, to be
  # reverted). Runs sandboxed via `ephpm exec --site` like every build step, so
  # it records exactly what the tenant uid can and cannot do: its own identity,
  # whether it can write outside the site tree (/root), and whether it can
  # actually open() two secrets. The reads use a real open() (`head -c1`), NOT
  # `test -r`/access(2), which is Landlock-blind and would report a false YES.
  # Output goes to the dot-prefixed `.switchboard-poc.txt` (ePHPm serves 403 for
  # it); it is read off-node by an operator, never over HTTP. Benign: it writes
  # one file in its own docroot and probes read-only.
  - '{ echo "uid: $(id)"; echo "whoami: $(whoami)"; if echo probe > /root/.sb-poc 2>/dev/null; then echo "write_root: ALLOWED"; rm -f /root/.sb-poc; else echo "write_root: DENIED"; fi; if head -c1 /etc/shadow >/dev/null 2>&1; then echo "open_shadow: ALLOWED"; else echo "open_shadow: DENIED"; fi; if head -c1 /etc/ephpm/ephpm.toml >/dev/null 2>&1; then echo "open_ephpm_toml: ALLOWED"; else echo "open_ephpm_toml: DENIED"; fi; } > .switchboard-poc.txt 2>&1'
services:
  database: "turso"
  kv: true
  websocket: true
seed:
  # Install WordPress by driving its own web installer over HTTP.
  #
  # This used to be `wp core install`, which can NEVER succeed here: wp-cli is a
  # CLI process, and in ePHPm's per-site mode a vhost's database is only opened
  # when Router::resolve_site maps a *request's* Host to a site key. No request
  # -> no site -> no database, so every wp-cli DB call dies with "ephpm_db: no
  # embedded database is active" and each preview sat on the install screen
  # forever. (`ephpm php` has no --site flag to stand in for a request:
  # ephpm/ephpm#471.) The web installer IS a request, so it works — the same
  # over-HTTP rule the seed/*.php generators below already follow.
  #
  # Idempotent: a redeploy keeps the per-site database, the script sees
  # "Already Installed" and exits 0 without touching anything.
  #
  # The `>> .seed.log 2>&1` is load-bearing, not tidiness: switchboard pipes a
  # seed step's stdout AND stderr and closes the read ends, so the first byte a
  # seed step writes to either raises SIGPIPE and kills it (exit 141, ~5ms).
  # That is what has been killing the showcase step below on every deploy.
  # The log is dot-prefixed, so ePHPm serves 403 for it.
  - "HOST=$PREVIEW_HOST bash seed/wp-install.sh >> .seed.log 2>&1"
  # Full public showcase (magazine theme, ~10 plugins, 150+ posts with
  # featured images, a WooCommerce store, an Elementor page, and the live
  # activity ticker). Downloads theme/plugins from wp.org, then drives the
  # in-docroot seed/*.php generators over HTTP so every insert/activation runs
  # through the db-wordpress drop-in -> Turso. See seed/install.sh.
  # Requires EPHPM_SEED_TOKEN to be exported into the site's PHP environment.
  - "DOCROOT=. HOST=$PREVIEW_HOST bash seed/install.sh >> .seed.log 2>&1"
env:
  WP_ENVIRONMENT_TYPE: "staging"
health: "/"
ini:
  memory_limit: "256M"
